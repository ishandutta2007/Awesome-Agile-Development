<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.5)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 52px;
        fill: url(#primaryGrad);
        letter-spacing: -1px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .animated-circle {
        animation: float 6s ease-in-out infinite alternate;
      }
      .pulse-orb {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .sprint-track {
        stroke-dasharray: 8 6;
        animation: dash 20s linear infinite;
      }
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-15px) rotate(4deg); }
      }
      @keyframes pulse {
        0% { opacity: 0.25; transform: scale(0.95); }
        100% { opacity: 0.55; transform: scale(1.05); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic ambient glowing orbs in the background -->
  <circle class="pulse-orb" cx="150" cy="80" r="130" fill="#38bdf8" filter="url(#glow)" opacity="0.3" />
  <circle class="pulse-orb" cx="1050" cy="300" r="160" fill="#a855f7" filter="url(#glow)" opacity="0.25" />
  <circle class="pulse-orb" cx="600" cy="380" r="120" fill="#6366f1" filter="url(#glow)" opacity="0.2" />

  <!-- Animated Agile Cycle Graphic (Background Accent - Right Side) -->
  <g class="animated-circle" transform="translate(920, 180)">
    <!-- Outer Sprint Loop -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="12" />
    <circle class="sprint-track" cx="0" cy="0" r="120" fill="none" stroke="url(#primaryGrad)" stroke-width="4" />
    
    <!-- Inner Kanban Stages Indicator -->
    <rect x="-85" y="-55" width="45" height="110" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="-22" y="-55" width="45" height="110" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#818cf8" stroke-width="1.5" />
    <rect x="40" y="-55" width="45" height="110" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#34d399" stroke-width="1.5" />
    
    <!-- Mini Cards inside columns -->
    <rect x="-78" y="-45" width="31" height="14" rx="3" fill="rgba(56, 189, 248, 0.4)" />
    <rect x="-78" y="-25" width="31" height="14" rx="3" fill="rgba(56, 189, 248, 0.2)" />
    <rect x="-15" y="-45" width="31" height="20" rx="3" fill="rgba(129, 140, 248, 0.5)" />
    <rect x="-15" y="-18" width="31" height="14" rx="3" fill="rgba(129, 140, 248, 0.3)" />
    <rect x="47" y="-45" width="31" height="16" rx="3" fill="rgba(52, 211, 153, 0.6)" />
    <rect x="47" y="-22" width="31" height="16" rx="3" fill="rgba(52, 211, 153, 0.4)" />
    <rect x="47" y="1" width="31" height="16" rx="3" fill="rgba(52, 211, 153, 0.5)" />

    <circle cx="0" cy="-120" r="8" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle cx="120" cy="0" r="8" fill="#818cf8" filter="url(#subtleGlow)" />
    <circle cx="0" cy="120" r="8" fill="#c084fc" filter="url(#subtleGlow)" />
    <circle cx="-120" cy="0" r="8" fill="#34d399" filter="url(#subtleGlow)" />
  </g>

  <!-- Content Group (Foreground) -->
  <g transform="translate(100, 110)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <text x="110" y="21" class="tag-text" fill="#38bdf8" text-anchor="middle">🚀 CURATED AGLE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="90" class="title-text">Awesome Agile Development</text>

    <!-- Subtitle -->
    <text x="0" y="135" class="sub-text">The definitive guide to Enterprise Agile SaaS &amp; Open-Source Project Management platforms</text>

    <!-- Interactive / Status Pills -->
    <g transform="translate(0, 175)">
      <!-- Pill 1: SaaS & Enterprise -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="22" cy="19" r="6" fill="#38bdf8" />
        <text x="36" y="24" class="tag-text">Enterprise SaaS</text>
      </g>

      <!-- Pill 2: Open Source -->
      <g transform="translate(195, 0)">
        <rect width="180" height="38" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="22" cy="19" r="6" fill="#34d399" />
        <text x="36" y="24" class="tag-text">Open-Source Core</text>
      </g>

      <!-- Pill 3: Transparent Pricing -->
      <g transform="translate(390, 0)">
        <rect width="210" height="38" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="22" cy="19" r="6" fill="#fbbf24" />
        <text x="36" y="24" class="tag-text">Transparent Pricing &amp; Free Tiers</text>
      </g>
    </g>
  </g>
</svg>
